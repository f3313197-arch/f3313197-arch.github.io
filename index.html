
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf3fa">
<title>NUMBER SHORT KING | Telegram Channel</title>
<meta name="description" content="Visit the NUMBER SHORT KING Telegram channel for channel updates and community posts.">
<style>
:root{--bg:#edf2f8;--ink:#101827;--muted:#64748b;--blue:#159fe0;--blue2:#087fc4;--white:#fff;--line:#dfe7f0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@keyframes floatIn{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softPulse{0%,100%{box-shadow:0 12px 24px #129bd344;filter:saturate(1)}50%{box-shadow:0 15px 30px #129bd366;filter:saturate(1.08)}}
@keyframes gentleShine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes ctaMove{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-3px) scale(1.012)}50%{transform:translateY(0) scale(1)}75%{transform:translateY(-2px) scale(1.008)}}
@keyframes ctaSweep{0%{left:-45%;opacity:0}12%{opacity:.55}55%{left:110%;opacity:0}100%{left:110%;opacity:0}}
@keyframes softShake{0%,84%,100%{transform:translateX(0) rotate(0)}86%{transform:translateX(-2px) rotate(-.35deg)}88%{transform:translateX(2px) rotate(.35deg)}90%{transform:translateX(-2px) rotate(-.25deg)}92%{transform:translateX(2px) rotate(.25deg)}94%{transform:translateX(-1px)}96%{transform:translateX(1px)}}
.avatar-ring{animation:floatIn 4.8s ease-in-out infinite}
.pill{transition:transform .25s ease,box-shadow .25s ease}
.pill:hover{transform:translateY(-3px);box-shadow:0 9px 20px #1c35501a}
.post{transition:transform .25s ease,box-shadow .25s ease}
.post:hover{transform:translateY(-2px);box-shadow:0 12px 28px #1f3a5a13}
.cta{isolation:isolate;overflow:hidden;background-size:200% 100%;animation:softPulse 2.8s ease-in-out infinite,gentleShine 6s linear infinite}
.cta::before{content:'';position:absolute;z-index:-1;top:-35%;left:-45%;width:32%;height:170%;background:linear-gradient(90deg,transparent,#ffffff88,transparent);transform:skewX(-22deg);animation:ctaSweep 3.1s ease-in-out infinite;pointer-events:none}
.cta>*{position:relative}.cta .telegram{animation:iconBob 2.4s ease-in-out infinite}@keyframes iconBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.cta:hover{filter:brightness(1.06)}
@media (prefers-reduced-motion:reduce){.cta,.cta::before,.locked{animation:none!important}}
.locked{animation:softPulse 3.4s ease-in-out infinite,softShake 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
body{margin:0;background:linear-gradient(180deg,#e7f3fc 0%,#f5f7fb 45%,#edf2f8 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.wrap{max-width:700px;margin:0 auto;padding:22px 16px 130px}
.status{display:table;margin:4px auto 22px;padding:10px 17px;border-radius:999px;background:#fff;box-shadow:0 5px 18px #1b344414;color:#344256;font-size:14px;font-weight:750}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22b573;margin-right:8px}
.hero{text-align:center;padding:12px 10px 8px}
.avatar-ring{width:156px;height:156px;margin:0 auto 24px;padding:5px;border-radius:50%;background:linear-gradient(140deg,#77d5ff,#078bd2);box-shadow:0 9px 28px #128ec52a}
.avatar{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #fff;background:#13233a}
.kicker{font-size:12px;letter-spacing:2.8px;font-weight:850;color:#3388b1;text-transform:uppercase}
h1{font-size:clamp(36px,9vw,58px);line-height:1.02;margin:10px 0 13px;letter-spacing:-1.9px;font-weight:950}
h1 span{color:#087fc4}
.subtitle{font-size:17px;line-height:1.6;color:var(--muted);margin:0 auto 23px;max-width:480px}
    .features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0 34px}
.pill{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 7px;text-align:center;font-size:13px;font-weight:800;color:#354256;box-shadow:0 4px 12px #1c355009}
.pill b{display:block;color:#138fce;font-size:21px;margin-bottom:4px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 3px 13px;font-size:19px;font-weight:900}
.section-head small{font-size:12px;color:#65758a;font-weight:750}
.post{background:#fff;border:1px solid #e0e7ef;border-radius:25px;padding:17px;margin:13px 0;box-shadow:0 8px 24px #1f3a5a0b}
.post-top{display:flex;align-items:center;gap:10px}
.mini-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #d6f0ff}
.post-title{font-size:15px;font-weight:900}
.tag{margin-left:auto;border-radius:999px;background:#e2f4ff;color:#087fc4;padding:7px 10px;font-size:11px;font-weight:900}
.blurred{position:relative;overflow:hidden;margin-top:14px;border-radius:15px;padding:15px;background:linear-gradient(110deg,#e7f7ff,#f8fbff 52%,#fff1df)}
.line{height:9px;border-radius:99px;background:#cbd7e4;opacity:.72;margin:7px 0;width:76%;filter:blur(2px)}
.line.short{width:49%}
.line.mid{width:63%}
.locked{display:table;margin:14px auto 1px;border-radius:999px;background:linear-gradient(100deg,#35b9f1,#0789cf);color:#fff;padding:12px 22px;font-weight:850;font-size:14px;box-shadow:0 7px 16px #129bd32b}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 24px);max-width:676px;box-sizing:border-box;position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;margin:0;padding:13px 15px;border:1px solid #ffffff70;border-radius:18px;background:linear-gradient(100deg,#36b9f1,#0789cf);color:#fff;font-size:clamp(16px,4.7vw,20px);font-weight:950;text-decoration:none;box-shadow:0 12px 28px #129bd366,0 0 0 1px #ffffff30 inset;transition:filter .2s ease;backdrop-filter:blur(8px)}
.cta:active{filter:brightness(.94)}
.telegram{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#fff;color:#159fe0;font-size:20px}
.free{font-size:12px;background:#ffffff30;padding:7px 10px;border-radius:99px}
.note{text-align:center;color:#6c7c90;font-size:13px;line-height:1.7;margin:14px auto 22px}
.safe{color:#26845d;font-weight:700}
.about{margin-top:26px;background:#fff;border:1px solid #e0e7ef;border-radius:24px;padding:22px;box-shadow:0 8px 24px #1f3a5a0b}
.about h2{font-size:20px;margin:0 0 9px}
.about p{font-size:14px;line-height:1.7;color:var(--muted);margin:0}
.footer{text-align:center;color:#8190a3;font-size:12px;padding:24px 8px 4px}
@media(min-width:560px){.wrap{padding-top:30px}.avatar-ring{width:172px;height:172px}.post{padding:20px}}
@media(max-width:360px){.features{gap:5px}.pill{font-size:11px}.cta{gap:8px;padding:12px 10px;border-radius:16px}}
</style>
</head>
